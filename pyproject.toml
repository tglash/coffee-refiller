[project]
name = "coffee-refiller"
version = "0.1.0"
description = "Learning prototype: an agent that reorders office coffee via MCP, UCP and AP2"
readme = "README.md"
authors = [
    { name = "Taylor Glas" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "ap2",
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "ucp-sdk>=0.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
coffee-refiller = "coffee_refiller:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
ap2 = { git = "https://github.com/google-agentic-commerce/AP2.git", rev = "e1ea56db72a6385bce3e5c1112b3a56ce60acb43" }

[tool.pytest.ini_options]
testpaths = ["tests"]
